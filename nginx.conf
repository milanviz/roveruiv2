server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static assets caching (1 year, immutable for Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Allow large file uploads (scripts, docs, PDFs)
    client_max_body_size 100M;

    # Proxy /vizru-api to backend server` (matching Vite dev proxy)
    location /vizru-api/ {
        proxy_pass https://ai-demo.vizru-ras.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-demo.vizru-ras.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA routing - fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
